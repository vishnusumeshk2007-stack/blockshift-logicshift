<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0d0f12" />
  <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="#242a33" stroke-width="1" />
  
  <!-- Heisenberg Hat Crown (Pixel Geometry) -->
  <rect x="10" y="6" width="12" height="4" fill="#f05a1a" />
  <!-- Hat Band / Ribbon -->
  <rect x="9" y="10" width="14" height="2" fill="#ff833a" />
  <!-- Hat Brim -->
  <rect x="5" y="12" width="22" height="2" fill="#f05a1a" />
  
  <!-- Face Contour / Logic Matrix -->
  <rect x="8" y="14" width="16" height="12" fill="#151920" />
  
  <!-- Glasses Frames (Pixel blocks) -->
  <rect x="9" y="16" width="5" height="4" fill="#f05a1a" />
  <rect x="18" y="16" width="5" height="4" fill="#f05a1a" />
  <!-- Bridge of glasses -->
  <rect x="14" y="17" width="4" height="2" fill="#ff833a" />
  <!-- Dark glass lenses -->
  <rect x="10" y="17" width="3" height="2" fill="#0d0f12" />
  <rect x="19" y="17" width="3" height="2" fill="#0d0f12" />
  
  <!-- Goatee / Logic Gate Die -->
  <rect x="13" y="22" width="6" height="3" fill="#f05a1a" />
  <rect x="14" y="25" width="4" height="2" fill="#ff833a" />

  <!-- Corner Tech Accent Dots -->
  <rect x="3" y="3" width="2" height="2" fill="#f05a1a" opacity="0.6" />
  <rect x="27" y="3" width="2" height="2" fill="#f05a1a" opacity="0.6" />
  <rect x="3" y="27" width="2" height="2" fill="#f05a1a" opacity="0.6" />
  <rect x="27" y="27" width="2" height="2" fill="#ff833a" opacity="0.8" />
</svg>
